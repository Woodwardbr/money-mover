<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Money Mover{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css?v=6" />
  <script src="/static/vendor/chart.umd.min.js"></script>
  <!-- Plaid ships a mutable `stable` URL so SRI is not possible. -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Money Mover</div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/budgets">Budgets</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/debt">Debt Tracker</a>
    </nav>
    <div class="actions">
      <span class="env-badge">env: {{ plaid_env }}</span>
      <button id="sync-btn" class="btn btn-secondary">Sync</button>
      <button id="link-btn" class="btn btn-primary">Link Account</button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js?v=20"></script>
</body>
</html>
